name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Gitea reads .github/workflows too, so every job here is gated to github.com.

jobs:
  tests:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # 0.13.373 pins Home Assistant 2026.10.2 and brings pytest, its plugins
      # and pytest-cov. uv installs the same packages as pip did (compared
      # 2026-10-30) in a fifth of the time; 0.12.23 is the uv the harness
      # itself pins.
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install "uv==0.12.23"
          .venv/bin/python -m uv pip install --python .venv/bin/python "mypy==1.18.2" "ruff==0.15.21" "pytest-homeassistant-custom-component==0.13.373"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      # Both suites measure into one coverage file; the second run is the gate.
      - run: .venv/bin/python -m pytest tests/test_models.py tests/test_api.py -p no:homeassistant --cov=custom_components/sslreverseproxy --cov-report=
      - run: .venv/bin/python -m pytest tests/ha --cov=custom_components/sslreverseproxy --cov-append --cov-report=term-missing --cov-fail-under=95
      - run: .venv/bin/python -m mypy custom_components/sslreverseproxy
      - run: .venv/bin/python tools/validate_local.py
